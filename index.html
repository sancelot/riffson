<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GuitarHero AI Coach</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <style>
      /* Custom scrollbar for dark theme */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
      
      /* Vibration animation for strings */
      @keyframes vibrate {
        0% { transform: translateY(0); }
        25% { transform: translateY(-1px); }
        75% { transform: translateY(1px); }
        100% { transform: translateY(0); }
      }
      .animate-vibrate {
        animation: vibrate 0.1s linear infinite;
      }

      /* Pulse for correct note */
      @keyframes pulse-glow {
        0% { filter: drop-shadow(0 0 2px #22c55e); }
        50% { filter: drop-shadow(0 0 8px #22c55e); }
        100% { filter: drop-shadow(0 0 2px #22c55e); }
      }
      .animate-glow {
        animation: pulse-glow 2s infinite;
      }

      /* Prevent bounce on mobile scroll */
      body {
        overscroll-behavior-y: contain;
      }
    </style>
  <script type="importmap">
{

  }
}
</script>
</head>
